<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 Sora,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

.body{color:var(--ai);overflow-wrap:anywhere}
.txt{white-space:pre-wrap}

.rb.live{background:var(--acc);color:#000;animation:aion-live 1.6s infinite}

#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,10px);background:#17171c;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(hover:none){.item .ic{opacity:1}}
.atom{width:30px;height:30px;flex:none;margin-right:2px;filter:drop-shadow(0 0 5px rgba(127,180,255,.45));animation:aion-spin 16s linear infinite}
.atom ellipse{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:0}
.atom .o1 ellipse{animation:ad1 4.6s infinite}.atom .o2 ellipse{animation:ad2 4.6s infinite}.atom .o3 ellipse{animation:ad3 4.6s infinite}
.atom .nu{fill:#fff;transform-box:fill-box;transform-origin:center;animation:an 4.6s cubic-bezier(.3,0,.2,1) infinite}
.atom .el{fill:#fff;animation:ae 4.6s ease-in-out infinite}
@keyframes aion-spin{to{transform:rotate(360deg)}}
@keyframes ad1{0%{stroke-dashoffset:1;opacity:1}30%{stroke-dashoffset:0}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ad2{0%,8%{stroke-dashoffset:1;opacity:1}38%{stroke-dashoffset:0}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ad3{0%,16%{stroke-dashoffset:1;opacity:1}46%{stroke-dashoffset:0}90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes an{0%,18%{transform:scale(0);opacity:1}34%{transform:scale(1.4)}44%{transform:scale(1)}90%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes ae{0%,46%{opacity:0}62%{opacity:1}90%{opacity:1}100%{opacity:0}}
@media(max-width:820px){#side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}#side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}header{display:flex}}

.hl{display:flex;align-items:center;gap:10px}#auth{display:flex;gap:8px;margin-left:auto}
.ab{border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13.5px;transition:background .15s;display:inline-flex;align-items:center}.ab:hover{background:var(--card)}.ab.pri{background:#fff;color:#000;border-color:#fff}.ab.pri:hover{background:var(--ai)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:30;padding:16px}.ov.on{display:grid}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(380px,100%)}.dlg h2{margin:0 0 14px;font-weight:500;font-size:20px}
.dlg input{width:100%;background:#08080a;border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;padding:10px 12px;margin:0 0 10px;outline:0}.dlg input:focus{border-color:var(--acc)}
.dlg small{display:block;color:var(--mut);font-size:12px;margin-top:10px}.er{color:var(--bad);font-size:13px;min-height:1.2em;margin:0 0 6px}.sw{color:var(--acc);text-decoration:underline}
.cb{margin:.4em 0 .9em;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}.cb pre{margin:0;border:0;border-radius:0}
.cbh{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}.cbh button{margin-left:12px;color:var(--mut)}.cbh button:hover{color:var(--ink)}
.ov#run.on{display:flex;flex-direction:column;background:#000}#run iframe{flex:1;border:0;background:#fff}#run button{align-self:flex-end;padding:8px 14px;color:#fff}
.srow{display:flex;gap:6px;align-items:center}.srow #new{flex:1}
#sbox{margin-top:10px;position:relative}#sbox input{width:100%;background:#08080a;border:1px solid var(--line);border-radius:10px;color:#fff;font:inherit;font-size:14px;padding:8px 30px 8px 12px;outline:0}#sbox input:focus{border-color:var(--acc)}
#sx{position:absolute;right:4px;top:3px;color:var(--mut);padding:4px 8px}
.snip{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .tw{flex:1;min-width:0}
mark{background:rgba(127,180,255,.3);color:inherit;border-radius:3px}
.none{color:var(--mut);font-size:13px;padding:10px}
.flash{animation:fl 2s;border-radius:10px}@keyframes fl{0%,60%{background:rgba(127,180,255,.18)}100%{background:none}}
.dlg{max-height:calc(100% - 8px);overflow-y:auto}.prof{display:grid;gap:8px;margin:0 0 12px}.prof button{border:1px solid var(--line);border-radius:12px;padding:7px 12px;text-align:left;font-size:14px;line-height:1.35;transition:border-color .15s,background .15s}.prof button small{display:block;color:var(--mut);font-size:12px}.prof button[aria-pressed=true]{border-color:var(--acc);background:#16202e}
</style>
</head>

<script>

const SYM={pi:'π',approx:'≈',pm:'±',leq:'≤',geq:'≥',neq:'≠',rightarrow:'→',infty:'∞',cdot:'·',times:'×'};
const plain=s=>s.replace(/ ?\[\d+\]/g,'').replace(/\[([^\]]+)\]\(https?:[^)]*\)/g,'$1').replace(/\\[\[\]()]|\$\$?/g,'').replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'($1)/($2)').replace(/\\sqrt\{([^}]*)\}/g,'√($1)').replace(/\\(pi|approx|pm|leq|geq|neq|rightarrow|infty|cdot|times)/g,(_,k)=>SYM[k]).replace(/\^2(?!\d)/g,'²').replace(/\^3(?!\d)/g,'³').replace(/\*\*|__|`/g,'').replace(/^#+\s*/gm,'').replace(/^\s*[-*]\s+/gm,'• ');
const EXT={javascript:'js',js:'js',python:'py',py:'py',java:'java',css:'css',cpp:'cpp',c:'c',csharp:'cs',go:'go',rust:'rs',php:'php',sql:'sql',bash:'sh',kotlin:'kt',swift:'swift',typescript:'ts',json:'json',html:'html'};
const codeFmt=s=>s.split('```').map((p,i)=>{if(!(i%2))return p.trim()?`<p>${esc(plain(p).trim()).replace(/\n/g,'<br>')}</p>`:'';const n=p.indexOf('\n'),lg=(n<0?p:p.slice(0,n)).trim().toLowerCase(),c=n<0?'':p.slice(n+1).replace(/\n$/,'');return`<div class="cb"><div class="cbh"><span>${esc(lg||'código')}</span><span><button type="button" data-a="copy">Copiar</button>${/^html?$/.test(lg)?'<button type="button" data-a="run">Ejecutar</button>':''}<button type="button" data-a="dl" data-x="${EXT[lg]||'txt'}">Descargar</button></span></div><pre><code>${esc(c)}</code></pre></div>`}).join('');
const fmt=m=>m.mode==='code'?codeFmt(m.content):`<div class="${m.mode==='math'?'math':'txt'}">${esc(plain(m.content))}</div>`;
const apiText=m=>m.kind==='calc'?`${m.expr} = ${m.result}`:m.content;

/* ---- red ---- */
function streamChat(messages,onD,signal,models=FAST,maxTok=0){
  return new Promise((res,rej)=>{
    const acs=[],tms=[];let win=-1,live=0,over=0,last;
    const end=(f,v)=>{if(over)return;over=1;tms.forEach(clearTimeout);acs.forEach(a=>a.abort());signal?.removeEventListener('abort',ab);f(v)};
    const ab=()=>end(rej,new DOMException('abort','AbortError'));signal?.addEventListener('abort',ab);
    const take=(i,x)=>{if(win<0){win=i;acs.forEach((a,j)=>j!==i&&a.abort())}if(win===i)onD(x)};
    async function run(i){const ac=acs[i],model=models[i];let got=false;
      for(const stream of [true,false]){
        try{const hd={'Content-Type':'application/json'};if(KEY)hd.Authorization='Bearer '+KEY;const b={model,messages,stream};if(maxTok)b.max_tokens=maxTok;
          const r=await fetch(KEY?EPK:EP,{method:'POST',headers:hd,signal:ac.signal,body:JSON.stringify(b)});
          if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;e.raw=(await r.text().catch(()=>'')).slice(0,200);throw e}
          if(stream&&(r.headers.get('content-type')||'').includes('event-stream')){const rd=r.body.getReader(),dc=new TextDecoder();let buf='',fin=0;
            while(!fin){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
              for(const l of ls){const t=l.trim();if(!t.startsWith('data:'))continue;const d=t.slice(5).trim();if(d==='[DONE]'){fin=1;break}
                try{const j=JSON.parse(d),x=j.choices?.[0]?.delta?.content??j.choices?.[0]?.text;if(typeof x==='string'&&x){got=true;take(i,x)}}catch{}}}}
          else{const t=await r.text();let c=t;try{const j=JSON.parse(t);c=j.choices?.[0]?.message?.content||j.choices?.[0]?.text||(typeof j.content==='string'?j.content:'');if(!c&&j.error)last=Object.assign(new Error('api'),{raw:typeof j.error==='string'?j.error:(j.error.message||'')})}catch{}
            if(typeof c==='string'&&c.trim()){got=true;take(i,c)}}
          if(got)return;last=last||new Error('vacío')
        }catch(e){if(over||ac.signal.aborted||got)return;last=e;if(e.status)break}}}
    const go=i=>{if(i>=models.length||acs[i]||over)return;acs[i]=new AbortController();live++;tms.push(setTimeout(()=>{if(win<0)go(i+1)},HEDGE));
      run(i).then(()=>{live--;if(over)return;if(win===i)end(res);else if(win<0&&!live){if(i+1<models.length)go(i+1);else end(rej,last||new Error('net'))}})};
    go(0);tms.push(setTimeout(()=>{if(win<0)end(rej,new Error('tiempo'))},40000))})}

const shrink=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.src=URL.createObjectURL(f)});
const LIBS={pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib'],docx:['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','mammoth']};
const lib=k=>window[LIBS[k][1]]?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src=LIBS[k][0];s.onload=ok;s.onerror=ko;document.head.append(s)});
async function pdfText(f){await lib('pdf');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=Math.min(d.numPages,60);i++)t+=(await(await d.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n';return t}
async function addFiles(list){for(const f of list){try{
  if(f.type.startsWith('image/'))files.push({n:f.name,img:await shrink(f)});
  else if(/\.pdf$/i.test(f.name))files.push({n:f.name,txt:await pdfText(f)});
  else if(/\.docx$/i.test(f.name)){await lib('docx');files.push({n:f.name,txt:(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value})}
  else if(f.type.startsWith('video/'))files.push({n:f.name,txt:''});
  else files.push({n:f.name,txt:await f.text()})}catch{files.push({n:f.name+' (no se pudo leer)',txt:''})}}chips();upd()}
function chips(){const c=$('#chips');c.innerHTML='';files.forEach((f,i)=>{const s=el('span','',esc(f.n));const b=el('button','','×');b.type='button';b.onclick=()=>{files.splice(i,1);chips();upd()};s.append(b);c.append(s)})}

  const L=$('#list');L.innerHTML='';const all=[...D].filter(c=>c.msgs.length||c.id===cid).sort((a,b)=>b.pinned-a.pinned||b.t-a.t);
  const qv=SQ.trim().toLowerCase(),hit=new Map(),tx=m=>String(apiText(m)||'');

    const d=el('div','item'+(c.id===cid?' on':'')),hi=hit.get(c)??-1;const t=el('span','tt',qv?mk(c.title,60):esc(c.title));

function setBusy(v){busy=v;sendB.innerHTML=v?IC_STOP:IC_SEND;upd()}
function upd(){sendB.disabled=!busy&&!input.value.trim()&&!files.length}
function push(m){const c=ensure();c.msgs.push(m);c.t=Date.now();return draw(m)}

async function runSearch(o){

  const items=await gather(q,sig);
  if(sig.aborted){st.remove();return}
  const m={role:'assistant',kind:'text',content:'',mode:'',srcLabel:'Fuentes:'};
  m.sources=[...items.slice(0,4).map(x=>({title:x.src+' · '+x.title.slice(0,45),url:x.url})),{title:'Buscar también en Google',url:'https://www.google.com/search?q='+encodeURIComponent(q)}];

  lastm.content=ctx?'Pregunta: '+q+'\n\nResultados de búsqueda (usa solo esto, no inventes nada; si no bastan, dilo):\n'+ctx:q;
  const sys=P.base+P.search+lesP(q)+(voiceOn?P.voice:'');
  const ac=new AbortController(),ab=()=>ac.abort();sig.addEventListener('abort',ab);
  let got=0,raf=0;const t1=setTimeout(()=>{if(!got)ac.abort()},ctx?9000:15000);
  const paint=()=>{raf=0;if(r){r.body.innerHTML=fmt(m);toBottom()}};

let reg=0,step=1,pick=new Set();
function authUI(){const a=$('#auth');a.innerHTML='';if(ME){const b=el('button','ab',`<span class="av">${esc(ME.name[0].toUpperCase())}</span>${esc(ME.name)}`);b.onclick=()=>{if(confirm('¿Cerrar la sesión de '+ME.name+'?'))sess(null)};a.append(b)}else{const l=el('button','ab','Iniciar sesión'),r=el('button','ab pri','Crear cuenta');l.onclick=()=>dlg(0);r.onclick=()=>dlg(1);a.append(l,r)}}
function dlg(r){reg=r;step=1;pick.clear();$('#fprof').hidden=true;['fn','fe','fp'].forEach(i=>$('#'+i).hidden=false);$('#fn').hidden=!r;$('#fp').autocomplete=r?'new-password':'current-password';$('#fat').textContent=r?'Crear cuenta':'Iniciar sesión';$('#fgo').textContent=r?'Crear cuenta':'Entrar';$('#fsw').textContent=r?'Ya tengo cuenta':'Crear una cuenta';$('#fer').textContent='';$('#ovA').classList.add('on');(r?$('#fn'):$('#fe')).focus()}
function sess(u){ME=u;try{u?localStorage.setItem('aion.ses',u.id):localStorage.removeItem('aion.ses')}catch{}ctl?.abort();cid=null;D=load();try{LES=JSON.parse(localStorage.getItem(LK()))||[]}catch{LES=[]}renderAll();authUI();ideas()}
$('#fsw').onclick=e=>{e.preventDefault();dlg(!reg)};$('#fx').onclick=e=>{e.preventDefault();$('#ovA').classList.remove('on')};
const pf=$('#fprof');Object.entries(PROF).forEach(([k,v])=>{const b=el('button','',esc(v[0])+'<small>'+esc(v[1])+'</small>');b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>{pick.has(k)?pick.delete(k):pick.add(k);b.setAttribute('aria-pressed',String(pick.has(k)))};pf.append(b)});
$('#fa').onsubmit=async e=>{e.preventDefault();const id=$('#fe').value.trim().toLowerCase(),p=$('#fp').value,er=$('#fer'),u=USERS[id];
  if(p.length<6)return er.textContent='La contraseña necesita al menos 6 caracteres.';
  if(reg&&step===1){if(u)return er.textContent='Ya existe una cuenta con ese correo.';step=2;['fn','fe','fp'].forEach(i=>$('#'+i).hidden=true);pf.hidden=false;$('#fat').textContent='¿Para qué vas a usar AION?';$('#fgo').textContent='Crear cuenta';er.textContent='Elige una o varias opciones: así AION se adapta a ti.';return}
  if(reg){if(u)return er.textContent='Ya existe una cuenta con ese correo.';const s=Math.random().toString(36).slice(2),g=D;USERS[id]={id,name:$('#fn').value.trim()||id.split('@')[0],s,h:await hs(p,s),prof:[...pick]};try{localStorage.setItem(UK,JSON.stringify(USERS))}catch{}ME=USERS[id];D=g;save();sess(ME)}
  else{if(!u||u.h!==await hs(p,u.s))return er.textContent='Correo o contraseña incorrectos.';sess(u)}
  $('#fp').value='';$('#ovA').classList.remove('on');toast('Sesión iniciada como '+ME.name+'.')};
thread.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const c=b.closest('.cb').querySelector('code').textContent,a=b.dataset.a;
  if(a==='copy'){try{await navigator.clipboard.writeText(c);b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar',1400)}catch{}}
  else if(a==='run'){$('#runf').srcdoc=c;$('#run').classList.add('on')}
  else{const u=URL.createObjectURL(new Blob([c])),l=el('a');l.href=u;l.download='aion.'+b.dataset.x;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}});
$('#runx').onclick=()=>{$('#run').classList.remove('on');$('#runf').srcdoc=''};
addEventListener('keydown',e=>{if(e.key==='Escape'){$('#ovA').classList.remove('on');$('#run').classList.remove('on')}});
authUI();
setMode('auto');setBusy(false);renderAll();input.focus();
</script>
</body>
</html>
